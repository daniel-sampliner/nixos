name: publish

on:
  push:
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: >-
    ${{ github.workflow }}-${{ contains(fromJSON('["main"]'), github.ref_name)
      && github.ref
      || github.sha }}

permissions: {}

jobs:
  cache-flake:
    runs-on: ubuntu-slim
    permissions:
      contents: read

    env:
      USER: runner

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.2
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ github.repository_owner }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: cache flake
        run: |
          nix eval --json .#lib.public_inputs \
            | jq -er 'to_entries[].value' \
            | cachix push "${GITHUB_REPOSITORY_OWNER:?}"

  gen-matrix:
    uses: ./.github/workflows/gen-matrix.yaml
    permissions:
      contents: read

    secrets:
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}

  containers:
    uses: ./.github/workflows/containers.yaml

    permissions:
      contents: read
      id-token: write
      packages: write

    needs:
      - gen-matrix

    secrets:
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}

    with:
      ctrs: ${{ needs.gen-matrix.outputs.ctrs }}
      release: true

  homes:
    uses: ./.github/workflows/homes.yaml
    permissions:
      contents: read

    needs:
      - gen-matrix

    with:
      homes: ${{ needs.gen-matrix.outputs.homes }}

    secrets:
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}

  success:
    uses: ./.github/workflows/success.yaml
    if: ${{ !cancelled() }}
    permissions: {}

    needs:
      - containers
      - gen-matrix
      - homes

    with:
      results: ${{ toJSON(needs.*.result) }}
