name: success

on:
  workflow_call:
    inputs:
      results:
        description: JSON array of the caller job results
        required: true
        type: string

permissions: {}

jobs:
  success:
    runs-on: ubuntu-slim

    permissions: {}

    steps:
      - name: success
        env:
          RESULTS: ${{ inputs.results }}
        run: |-
          jq -e 'length > 0 and all(. == "success" or . == "skipped")' \
            <<<"${RESULTS:?}"
