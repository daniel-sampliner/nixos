name: build

on:
  push:
    branches:
      - "**"
      - "!nix-update/**"
      - "nix-update/pr"

  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: >-
    ${{ github.workflow }}-${{ contains(fromJSON('["main"]'), github.ref_name)
      && github.ref
      || github.sha }}

jobs:
  cache-flake:
    runs-on: ubuntu-slim
    env:
      USER: runner

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.2
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ github.repository_owner }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: cache flake
        run: |
          nix eval --json .#lib.public_inputs \
            | jq -er 'to_entries[].value' \
            | cachix push "${GITHUB_REPOSITORY_OWNER:?}"

  gen-containers:
    runs-on: ubuntu-slim
    env:
      USER: runner

    outputs:
      ctrs: ${{ steps.main.outputs.ctrs }}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.2
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ github.repository_owner }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: list containers
        id: main
        run: |
          nix eval --json '.#containers.entries' --apply 'builtins.attrNames' \
            | jq -er '"ctrs=\(tojson)"' \
            | tee -a "${GITHUB_OUTPUT:?}"

  containers:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      packages: write

    needs:
      - gen-containers

    strategy:
      fail-fast: false
      matrix:
        ctr: ${{ fromJSON(needs.gen-containers.outputs.ctrs) }}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.2
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ github.repository_owner }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: build
        env:
          CTR: ${{ matrix.ctr }}
        run: |
          nix -L build ".#containers.entries.${CTR:?}"

      - name: log into ghcr.io registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          skopeo login \
            --password-stdin <<<"${GITHUB_TOKEN:?}"\
            --username "${GITHUB_ACTOR:?}" \
            ghcr.io

      - name: configure skopeo sigstore
        run: |
          dir=${GITHUB_WORKSPACE:?}/.github/workflows/sigstore
          sudo install -Dm0644 -t /etc/containers/registries.d "$dir/ghcr.yaml"

      - name: push image to ghcr.io
        uses: actions/github-script@v9.0.0
        env:
          ctr: ${{ matrix.ctr }}
        with:
          script: |
            const script = require(`${process.env.GITHUB_WORKSPACE}/.github/workflows/push_image.js`);
            const ret = await script(process.env.ctr, { core, exec });
            if (!ret) core.setFailed("failed to push all tags");

  success:
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    needs:
      - containers
      - gen-containers

    steps:
      - name: success
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |-
          jq -e 'length > 0 and all(. == "success" or . == "skipped")' \
            <<<"${RESULTS:?}"
