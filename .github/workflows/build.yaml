name: build

on:
  push:
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: >-
    ${{ github.workflow }}- ${{ contains(fromJSON('["main"]'), github.ref_name)
      && github.ref
      || github.sha }}

jobs:
  cache-flake:
    runs-on: ubuntu-slim
    env:
      USER: runner

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.2
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ github.repository_owner }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
          skipPush: true

      - name: cache flake
        run: |
          nix eval --json .#lib.public_input_paths \
            | jq -er '.[]' \
            | cachix push "${GITHUB_REPOSITORY_OWNER:?}"

  gen-containers:
    runs-on: ubuntu-slim
    env:
      USER: runner

    outputs:
      ctrs: ${{ steps.main.outputs.ctrs }}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.2
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ github.repository_owner }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: list containers
        id: main
        run: |
          nix eval --json '.#containers.entries' --apply 'builtins.attrNames' \
            | jq -er '"ctrs=\(tojson)"' \
            | tee -a "${GITHUB_OUTPUT:?}"

  containers:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      packages: write

    needs:
      - gen-containers

    strategy:
      fail-fast: false
      matrix:
        ctr: ${{ fromJSON(needs.gen-containers.outputs.ctrs) }}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.2
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ github.repository_owner }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: build
        env:
          CTR: ${{ matrix.ctr }}
        run: |
          nix -L build --keep-going ".#containers.entries.${CTR:?}"

      - name: log into ghcr.io registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          skopeo login \
            --password-stdin <<<"${GITHUB_TOKEN:?}"\
            --username "${GITHUB_ACTOR:?}" \
            ghcr.io

      - name: fetch github OIDC token
        uses: actions/github-script@v9.0.0
        id: oidc-token
        with:
          script: |
            const token = await core.getIDToken("sigstore");
            core.setOutput("token", token);

      - name: configure skopeo sigstore
        env:
          OIDC_TOKEN: ${{ steps.oidc-token.outputs.token }}
        run: |
          dir=${GITHUB_WORKSPACE:?}/.github/workflows/sigstore
          sudo install -Dm0644 -t /etc/containers/registries.d "$dir/ghcr.yaml"

          mkdir -p "${RUNNER_TEMP:?}"
          envsubst '$OIDC_TOKEN' <"$dir/sigstore-params.yaml" >"$RUNNER_TEMP/sigstore-params.yaml"

      - name: push image to ghcr.io
        env:
          CTR: ${{ matrix.ctr }}
        run: |
          installable=".#containers.entries.${CTR:?}"
          github_ref_name_safe=$(<<<"${GITHUB_REF_NAME:?}" tr -cs '[:alnum:]-' '-' \
            | sed -E 's/-+$//')
          repository=$(nix eval --raw "$installable.meta.repository")

          publish=""
          if [[ ${GITHUB_REF_NAME:?} == main ]]; then
            publish=publish
          fi

          skopeo_args=(
            --dest-compress-format zstd:chunked
            --retry-times 5
          )
          if [[ -n $publish ]]; then
            skopeo_args+=(--sign-by-sigstore "${RUNNER_TEMP:?}/sigstore-params.yaml")
          fi

          for tag in "${GITHUB_SHA:?}" "${github_ref_name_safe:?}"; do
            nix run "$installable.passthru.copyTo" -- "${skopeo_args[@]}" "docker://${repository:?}:$tag"
            echo "::notice::pushed image ${repository:?}:$tag" ${publish:+(SIGNED)}
          done

          if [[ -z $publish ]]; then
            exit 0
          fi

          while IFS=$'\t' read -r tag; do
            nix run "$installable.passthru.copyTo" -- "${skopeo_args[@]}" "docker://${repository:?}:$tag"
            echo "::notice::pushed image ${repository:?}:$tag" ${publish:+(SIGNED)}
          done < <(nix eval --json "$installable.meta.tags" | jq -er '@tsv')

  success:
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    needs:
      - containers
      - gen-containers

    steps:
      - name: success
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |-
          jq -e 'length > 0 and all(. == "success" or . == "skipped")' \
            <<<"${RESULTS:?}"
