name: build

on:
  pull_request:

  push:
    branches:
      - "**"
      - "!main"
      - "!nix-update/**"
      - "nix-update/pr"

  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || (contains(fromJSON('["main"]'), github.ref_name) && format('ref-{0}', github.ref_name)) || github.sha }}

permissions: {}

jobs:
  gen-matrix:
    uses: ./.github/workflows/gen-matrix.yaml
    permissions:
      contents: read

  containers:
    uses: ./.github/workflows/containers.yaml

    permissions:
      contents: read
      id-token: write
      packages: write

    needs:
      - gen-matrix

    with:
      ctrs: ${{ needs.gen-matrix.outputs.ctrs }}
      cache-enabled: true

  homes:
    uses: ./.github/workflows/homes.yaml
    permissions:
      contents: read

    needs:
      - gen-matrix

    with:
      homes: ${{ needs.gen-matrix.outputs.homes }}

  success:
    uses: ./.github/workflows/success.yaml
    if: ${{ !cancelled() }}
    permissions: {}

    needs:
      - containers
      - gen-matrix
      - homes

    with:
      results: ${{ toJSON(needs.*.result) }}
