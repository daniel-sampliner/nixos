name: nix-update

on:
  push:
    branches:
      - '**'
      - '!nix-update/**'

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}

env:
  BRANCH: ${{ github.workflow }}/temp

jobs:
  flake-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      changed: ${{ steps.update.outputs.changed }}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.2
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ github.repository_owner }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: create and push branch
        run: |
          git switch -C "${BRANCH:?}" HEAD
          git push --set-upstream origin --force "$BRANCH"

      - name: update
        id: update
        run: |
          mapfile -t inputs \
            < <(nix eval --json .#lib.public_inputs | jq -er 'del(.self) | to_entries[].key')
          nix -L flake update "${inputs[@]:?}" \
            2> >(sed -u '/Updated input/,/→/w '"${RUNNER_TEMP:?}/commit_body" >&2)

          if ! git status --porcelain=v2 | grep -q '^1 '; then
            echo "changed=false" | tee -a "${GITHUB_OUTPUT:?}"
            exit 0
          fi

          {
            echo '```'
            cat "${RUNNER_TEMP:?}/commit_body"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY:?}"

          echo "changed=true" | tee -a "${GITHUB_OUTPUT:?}"

      - name: commit
        if: ${{ steps.update.outputs.changed == 'true' }}
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const script = require(`${process.env.GITHUB_WORKSPACE}/.github/workflows/commit.js`);
            const ret = await script("chore(nix): update inputs", { exec, github });
            core.notice(`created commit: ${ret.createCommitOnBranch.commit.url}`);

      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        if: ${{ steps.update.outputs.changed == 'true' }}
        with:
          client-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-actions: write

      - name: trigger build workflow
        if: ${{ steps.update.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run build.yaml --ref "${BRANCH:?}"

  raise-pr:
    runs-on: ubuntu-slim
    needs:
      - flake-update

    if: ${{ needs.flake-update.outputs.changed == 'true' }}

    env:
      USER: runner

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 30
          filter: "blob:none"

      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: create branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -x
          new_ref=refs/heads/${BRANCH%/*}/pr
          sha=$(git rev-parse "${BRANCH:?}")
          : "${new_ref:?}" "${sha:?}"

          base_url="/repos/${GITHUB_REPOSITORY:?}/git"

          ret=0
          git ls-remote --exit-code --heads origin "$new_ref" || ret=$?
          case $ret in
          0) # update existing branch
            gh api \
              --method PATCH \
              "$base_url/$new_ref" \
              --field "sha=$sha" \
              --field force=true
            ;;
          2) # create new branch
            gh api \
              --method POST \
              "$base_url/refs" \
              --field "ref=$new_ref" \
              --field "sha=$sha"
            ;;
          *)
            echo "::error::failed to list remote git refs: $ret"
            exit $ret
            ;;
          esac

      - name: create or edit PR
        env:
          BRANCH: ${{ github.workflow }}/pr
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -x

          body="${RUNNER_TEMP:?}/body"
          git log "${GITHUB_SHA:?}".. --format='* %s' >"$body"

          commit_type=chore
          if grep -q '^\* feat\b' "$body"; then
            commit_type=feat
          fi

          cmd=create
          if [[ "$(gh pr view --json closed --jq .closed)" == false ]]; then
            cmd=edit
          fi

          pr=$(gh pr "$cmd" \
            --title "$commit_type: nightly update" \
            --body-file "$body")

          {
            echo "[Pull Request](${pr:?})"
            echo '```'
            echo "$pr"
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY:?}"

  cleanup-branch:
    runs-on: ubuntu-slim
    if: always()
    needs:
      - raise-pr

    permissions:
      contents: write

    env:
      USER: runner

    steps:
      - uses: actions/checkout@v7.0.1
      - name: delete branch
        if: always()
        run: |-
          git switch -d HEAD
          git push origin --delete "${BRANCH:?}"
