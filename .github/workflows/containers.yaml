name: containers

on:
  workflow_call:
    inputs:
      ctrs:
        description: JSON array of container attribute names
        type: string
        required: true

      cache-enabled:
        description: Run the nix store cache path
        type: boolean
        default: false

      release:
        description: Sign the pushed tags with sigstore
        type: boolean
        default: false

    secrets:
      CACHIX_SIGNING_KEY:
        description: Cachix signing key; an empty value reads as pull-only
        required: false

permissions: {}

jobs:
  containers:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        ctr: ${{ fromJSON(inputs.ctrs) }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: set nix store cache env
        if: ${{ inputs.cache-enabled }}
        run: bash "${GITHUB_WORKSPACE:?}/.github/workflows/nix-cache-env.sh"

      - name: run post-build-hook daemon
        if: ${{ inputs.cache-enabled }}
        background: true
        id: post-build-hook-daemon
        run: |
          bash "${GITHUB_WORKSPACE:?}/.github/workflows/post-build-hook-daemon.sh"

      - uses: actions/cache@v6.1.0
        if: ${{ inputs.cache-enabled }}
        id: cache
        with:
          path: |
            ${{ env.CACHE_DIR }}
          key: nix-ctr-v1-${{ matrix.ctr }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-ctr-v1-${{ matrix.ctr }}-
            nix-ctr-v1-

      - name: ensure nix store cache is runner-writable
        if: ${{ inputs.cache-enabled }}
        run: bash "${GITHUB_WORKSPACE:?}/.github/workflows/nix-cache-dir.sh"

      - uses: cachix/install-nix-action@v31.11.2
        if: ${{ inputs.cache-enabled }}
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.CACHE_URL }}
            post-build-hook = ${{ env.GH_CACHE_POST_BUILD_HOOK_DIR }}/script

      - uses: cachix/install-nix-action@v31.11.2
        if: ${{ !inputs.cache-enabled }}

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ github.repository_owner }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}

      # cachix use replaces substituters in the user config; re-add the file
      # cache dropped from the system config.
      - name: re-add nix store cache substituter
        if: ${{ inputs.cache-enabled }}
        run: bash "${GITHUB_WORKSPACE:?}/.github/workflows/nix-cache-substituter.sh"

      - name: build
        env:
          CTR: ${{ matrix.ctr }}
        run: |
          nix -L build ".#containers.entries.${CTR:?}"

      - name: log into ghcr.io registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          skopeo login \
            --password-stdin <<<"${GITHUB_TOKEN:?}"\
            --username "${GITHUB_ACTOR:?}" \
            ghcr.io

      - name: configure skopeo sigstore
        run: |
          dir=${GITHUB_WORKSPACE:?}/.github/workflows/sigstore
          sudo install -Dm0644 -t /etc/containers/registries.d "$dir/ghcr.yaml"

      - name: push image to ghcr.io
        uses: actions/github-script@v9.0.0
        env:
          ctr: ${{ matrix.ctr }}
        with:
          script: |
            const script = require(`${process.env.GITHUB_WORKSPACE}/.github/workflows/push_image.js`);
            const ret = await script(process.env.ctr, ${{ inputs.release }}, { core, exec });
            if (!ret) core.setFailed("failed to push all tags");

      - name: stop post-build-hook daemon
        if: ${{ inputs.cache-enabled && always() }}
        run: bash "${GITHUB_WORKSPACE:?}/.github/workflows/nix-cache-daemon-teardown.sh"
